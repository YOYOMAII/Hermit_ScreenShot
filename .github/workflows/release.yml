# Build Mac + Windows desktop zips and publish a GitHub Release for friends.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (example v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and build
        run: |
          python -m pip install -r requirements-desktop.txt
          python scripts/generate_app_icons.py
          python -m PyInstaller --noconfirm --clean code_screenshots.spec

      - name: Package HermitScreenshot-Mac.zip
        run: |
          mkdir -p releases
          cp GETTING-STARTED.md dist/
          cd dist
          zip -r -y ../releases/HermitScreenshot-Mac.zip HermitScreenshot.app GETTING-STARTED.md

      - uses: actions/upload-artifact@v4
        with:
          name: HermitScreenshot-Mac
          path: releases/HermitScreenshot-Mac.zip
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and build
        run: |
          python -m pip install -r requirements-desktop.txt
          python scripts/generate_app_icons.py
          python -m PyInstaller --noconfirm --clean code_screenshots.spec

      - name: Package HermitScreenshot-Windows.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases | Out-Null
          Compress-Archive -Path dist/HermitScreenshot.exe, GETTING-STARTED.md `
            -DestinationPath releases/HermitScreenshot-Windows.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: HermitScreenshot-Windows
          path: releases/HermitScreenshot-Windows.zip
          if-no-files-found: error

  publish:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    env:
      # Public download-only repo: its release "Source code" archives contain just a README.
      PUBLIC_REPO: YOYOMAII/HermitScreenshot
      HAS_RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: HermitScreenshot-*
          merge-multiple: true
          path: bundles

      - name: Collect zip files
        run: |
          find bundles -name '*.zip' -exec cp {} . \;
          ls -lh *.zip

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Write friend-facing release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## Download

          | Platform | File | How to open |
          |----------|------|-------------|
          | **Mac** | HermitScreenshot-Mac.zip | Unzip → right-click **HermitScreenshot.app** → **Open** → **Open** (first time) |
          | **Windows** | HermitScreenshot-Windows.zip | Unzip → double-click **HermitScreenshot.exe** → **More info** → **Run anyway** if asked |

          No Python needed. Your files stay on your computer.

          ## Features

          - Code screenshots from **HTML** and **CSS** (VS Code style)
          - **HermitSmart** — add screenshots to a Word **.docx** with captions

          See **GETTING-STARTED.md** inside the zip for help.

          **Version:** ${{ steps.meta.outputs.tag }}
          EOF

      - name: Publish to public download repo
        if: env.HAS_RELEASES_TOKEN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.PUBLIC_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Download HermitScreenshot (Mac & Windows)
          generate_release_notes: false
          make_latest: true
          body_path: release-notes.md
          files: |
            HermitScreenshot-Mac.zip
            HermitScreenshot-Windows.zip

      - name: Warn that friends cannot see this release
        if: env.HAS_RELEASES_TOKEN != 'true'
        run: echo "::warning::RELEASES_TOKEN is not set, so this release goes to the private repo and friends cannot download it. See README (Publish a new release)."

      - name: Publish to this repo (fallback)
        if: env.HAS_RELEASES_TOKEN != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Download HermitScreenshot (Mac & Windows)
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            HermitScreenshot-Mac.zip
            HermitScreenshot-Windows.zip
